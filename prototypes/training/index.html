<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>훈련 일정 시안</title>
<style>
  :root {
    color-scheme: light;
    --navy: #1f2d4d;
    --navy-soft: #4a5775;
    --cream: #f7f1e1;
    --paper: #fffaf0;
    --border: #e4dcc6;
    --grass: #4f8f4a;
    --grass-soft: #e3efdc;
    --warn: #b4441f;
    --warn-soft: #fbe6dc;
    --gold: #c98a12;
    --focus: #e0761b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--navy);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .note { margin: 2px 0 20px; color: var(--navy-soft); font-size: 0.9rem; }

  .layout { display: grid; gap: 16px; grid-template-columns: 280px 1fr; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .topbar {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
    margin-bottom: 12px;
  }
  .date { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .upcoming { margin: 0; font-size: 0.9rem; color: var(--navy-soft); }
  .hint { font-size: 0.8rem; font-weight: 400; color: var(--navy-soft); }
  .player h2 { margin-bottom: 0; }
  /* 작은 화면에서는 현재 행동(일정 편성)을 먼저 보여준다 */
  @media (max-width: 760px) { .player { order: 2; } }

  /* 능력 표 */
  .stats { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
  .stats th { text-align: left; font-weight: 500; padding: 3px 0; }
  .stats td { text-align: right; padding: 3px 0 3px 6px; white-space: nowrap; }
  .stats .grade { display: inline-block; min-width: 1.6em; text-align: center; font-weight: 700; color: var(--grass); }
  .stats .delta-up { color: var(--grass); font-weight: 600; }
  .stats .delta-down { color: var(--warn); font-weight: 600; }
  .stats caption { text-align: left; font-weight: 700; padding: 10px 0 4px; }
  .stats tr + tr th, .stats tr + tr td { border-top: 1px dashed var(--border); }

  /* 주간 일정 */
  .weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 520px) { .weeks { grid-template-columns: repeat(2, 1fr); } }
  .week {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; min-height: 76px; text-align: left;
  }
  .week .label { font-size: 0.8rem; color: var(--navy-soft); }
  .week .activity { font-weight: 700; }
  .week.empty .activity { color: var(--navy-soft); font-weight: 500; }
  .week[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); background: #fff3d6; }
  .week[aria-pressed="true"] .label { color: var(--navy); }
  .week-flow { margin: 8px 0 0; font-size: 0.85rem; color: var(--navy-soft); }

  /* 활동 */
  .activities { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; width: 100%; }
  .card .name { font-weight: 700; }
  .card .effects { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    font-size: 0.78rem; padding: 1px 7px; border-radius: 999px;
    background: var(--grass-soft); color: #2d5b2a;
  }
  .chip.cost { background: var(--warn-soft); color: var(--warn); }
  .card .desc { font-size: 0.82rem; color: var(--navy-soft); }

  /* 경고와 확정 */
  .alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .alerts li { padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; background: var(--grass-soft); }
  .alerts li.risk { background: var(--warn-soft); color: var(--warn); }
  .alerts li strong { margin-right: 4px; }
  .confirm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .confirm-reason { font-size: 0.88rem; color: var(--navy-soft); }
  .result { margin-top: 10px; font-weight: 600; }

  button {
    font: inherit; color: var(--navy);
    min-height: 44px; padding: 8px 12px;
    border-radius: 8px; border: 2px solid var(--navy);
    background: var(--paper); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #fff3d6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--navy); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: #2d3f68; }
  button.ghost { border-color: var(--border); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .stack { display: grid; gap: 16px; }
</style>
</head>
<body>
<main>
  <h1>훈련 일정 시안</h1>
  <p class="note">한 달 네 주의 활동을 편성하는 화면 시안입니다. 수치와 효과는 확인용 임시 값이며 실제 게임 규칙이 아닙니다.</p>

  <header class="topbar">
    <p class="date">1학년 3월 · 김야구</p>
    <p class="upcoming">이달 말 <strong>연습경기</strong>가 있습니다.</p>
  </header>

  <div class="layout">
    <aside class="panel player" aria-labelledby="player-title">
      <h2 id="player-title">선수 상태 <span class="hint">월말 예상 변화 포함</span></h2>
      <table class="stats" id="ability-table">
        <caption>야구 능력 <span class="visually-hidden">(현재 값, 월말 예상 변화)</span></caption>
        <tbody></tbody>
      </table>
      <table class="stats" id="condition-table">
        <caption>생활 상태</caption>
        <tbody></tbody>
      </table>
    </aside>

    <div class="stack">
      <section class="panel" aria-labelledby="weeks-title">
        <h2 id="weeks-title">이번 달 일정</h2>
        <div class="weeks" id="weeks"></div>
        <p class="week-flow" id="week-flow"></p>
      </section>

      <section class="panel" aria-labelledby="activities-title">
        <h2 id="activities-title">활동 선택</h2>
        <div class="activities" id="activities"></div>
      </section>

      <section class="panel" aria-labelledby="forecast-title">
        <h2 id="forecast-title">확정 전 확인</h2>
        <ul class="alerts" id="alerts" aria-live="polite"></ul>
        <div class="confirm-row">
          <button type="button" class="primary" id="confirm">일정 확정</button>
          <button type="button" class="ghost" id="clear-all">전체 비우기</button>
          <span class="confirm-reason" id="confirm-reason"></span>
        </div>
        <p class="result" id="result" aria-live="polite"></p>
      </section>
    </div>
  </div>
</main>

<script>
  // ---- 콘텐츠: 임시 수치 ----
  const ABILITIES = [
    { id: "contact", name: "컨택" },
    { id: "power", name: "파워" },
    { id: "eye", name: "선구안" },
    { id: "speed", name: "주루" },
    { id: "defense", name: "수비" },
    { id: "mental", name: "멘탈" },
  ];
  const CONDITIONS = [
    { id: "stamina", name: "체력", higherIsBetter: true },
    { id: "stress", name: "스트레스", higherIsBetter: false },
    { id: "study", name: "학업", higherIsBetter: true },
    { id: "trust", name: "감독 신뢰", higherIsBetter: true },
  ];
  const NAMES = Object.fromEntries([...ABILITIES, ...CONDITIONS].map((s) => [s.id, s.name]));

  const ACTIVITIES = [
    { id: "batting", name: "타격 훈련", training: true, effects: { contact: 4, power: 1, stamina: -18, stress: 8, trust: 1 }, desc: "컨택을 크게 올립니다." },
    { id: "weights", name: "웨이트", training: true, effects: { power: 4, stamina: -20, stress: 8 }, desc: "파워를 크게 올립니다." },
    { id: "field", name: "주루·수비 훈련", training: true, effects: { speed: 3, defense: 3, stamina: -15, stress: 5, trust: 2 }, desc: "기동력과 팀 기여를 높입니다." },
    { id: "tactics", name: "전술 공부", training: true, effects: { eye: 3, mental: 2, stamina: -5, stress: 4 }, desc: "선구안과 멘탈을 높입니다." },
    { id: "study", name: "학교 공부", training: false, effects: { study: 6, stamina: -5, stress: 6 }, desc: "학업과 대학 진로에 도움이 됩니다." },
    { id: "friends", name: "친구와 시간 보내기", training: false, effects: { stamina: 5, stress: -12 }, desc: "스트레스를 풀고 반 친구와 가까워집니다." },
    { id: "rest", name: "휴식", training: false, effects: { stamina: 25, stress: -6 }, desc: "체력을 크게 회복합니다." },
  ];

  const START = {
    contact: 38, power: 32, eye: 35, speed: 40, defense: 36, mental: 30,
    stamina: 80, stress: 20, study: 50, trust: 30,
  };

  const RULES = {
    weeks: 4,
    tiredStamina: 30,  // 이보다 낮은 체력으로 훈련하면 능력 성장이 절반
    injuryStamina: 15, // 주가 끝났을 때 이보다 낮으면 부상 위험
    highStress: 70,
    matchStamina: 40,  // 경기 직전 체력 권장선
  };

  // ---- 규칙: 화면과 분리된 순수 계산 ----
  const clamp = (v) => Math.max(0, Math.min(100, v));

  function grade(value) {
    const table = [[90, "S"], [80, "A"], [70, "B"], [60, "C"], [50, "D"], [40, "E"], [20, "F"]];
    const found = table.find(([min]) => value >= min);
    return found ? found[1] : "G";
  }

  // 일정을 주마다 순서대로 적용하고, 각 주의 결과와 주의 사항을 돌려준다.
  function projectMonth(start, plan) {
    let stats = { ...start };
    const weeks = plan.map((activityId, index) => {
      const activity = ACTIVITIES.find((a) => a.id === activityId);
      if (!activity) return { index, empty: true, stats };
      const tired = activity.training && stats.stamina < RULES.tiredStamina;
      const next = { ...stats };
      for (const [key, delta] of Object.entries(activity.effects)) {
        const isAbility = ABILITIES.some((a) => a.id === key);
        const applied = tired && isAbility && delta > 0 ? Math.floor(delta / 2) : delta;
        next[key] = clamp(next[key] + applied);
      }
      stats = next;
      return {
        index,
        activity,
        tired,
        injuryRisk: stats.stamina < RULES.injuryStamina,
        stats,
      };
    });
    return { weeks, end: stats };
  }

  function buildAlerts(start, plan, projection) {
    const alerts = [];
    const filled = plan.filter(Boolean).length;
    projection.weeks.forEach((w) => {
      if (w.tired) alerts.push({ risk: true, text: `${w.index + 1}주차: 체력이 ${RULES.tiredStamina} 미만인 채 훈련해 능력 성장이 절반으로 줄어듭니다.` });
      if (w.injuryRisk) alerts.push({ risk: true, text: `${w.index + 1}주차: 체력이 ${RULES.injuryStamina} 미만으로 떨어져 부상 위험이 있습니다.` });
    });
    const end = projection.end;
    if (filled === RULES.weeks && end.stamina < RULES.matchStamina) {
      alerts.push({ risk: true, text: `연습경기 직전 체력이 ${end.stamina}입니다. 경기에서 타석 전망이 나빠질 수 있습니다.` });
    }
    if (end.stress >= RULES.highStress) {
      alerts.push({ risk: true, text: `월말 스트레스가 ${end.stress}로 높습니다. 친구와의 시간이나 휴식을 고려하세요.` });
    }
    if (filled === RULES.weeks && alerts.length === 0) {
      alerts.push({ risk: false, text: `연습경기 직전 체력 ${end.stamina}, 스트레스 ${end.stress}로 무리 없는 일정입니다.` });
    }
    if (filled < RULES.weeks) {
      alerts.push({ risk: false, text: `아직 ${RULES.weeks - filled}주가 비어 있습니다. 주를 고른 뒤 활동을 선택하세요.` });
    }
    return alerts;
  }

  // ---- 화면 상태 ----
  let plan = Array(RULES.weeks).fill(null);
  let activeWeek = 0;
  let confirmed = false;

  function formatDelta(delta, higherIsBetter = true) {
    if (delta === 0) return "";
    const good = higherIsBetter ? delta > 0 : delta < 0;
    const cls = good ? "delta-up" : "delta-down";
    const label = good ? "좋아짐" : "나빠짐";
    return ` <span class="${cls}">${delta > 0 ? "▲" : "▼"}${Math.abs(delta)}<span class="visually-hidden"> ${label}</span></span>`;
  }

  function renderStats(end) {
    document.querySelector("#ability-table tbody").innerHTML = ABILITIES.map((a) => `
      <tr><th scope="row">${a.name}</th>
        <td><span class="grade">${grade(START[a.id])}</span> ${START[a.id]}${formatDelta(end[a.id] - START[a.id])}</td></tr>`).join("");
    document.querySelector("#condition-table tbody").innerHTML = CONDITIONS.map((c) => `
      <tr><th scope="row">${c.name}</th>
        <td>${START[c.id]}${formatDelta(end[c.id] - START[c.id], c.higherIsBetter)}</td></tr>`).join("");
  }

  function renderWeeks(projection) {
    const box = document.getElementById("weeks");
    box.innerHTML = "";
    plan.forEach((activityId, i) => {
      const activity = ACTIVITIES.find((a) => a.id === activityId);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "week" + (activity ? "" : " empty");
      btn.setAttribute("aria-pressed", String(i === activeWeek));
      btn.disabled = confirmed;
      const w = projection.weeks[i];
      const after = activity ? `체력 ${w.stats.stamina}` : "";
      btn.innerHTML = `
        <span class="label">${i + 1}주차${i === activeWeek ? " · 편성 중" : ""}</span>
        <span class="activity">${activity ? activity.name : "비어 있음"}</span>
        <span class="label">${after}</span>`;
      btn.addEventListener("click", () => { activeWeek = i; render(); });
      box.append(btn);
    });
    document.getElementById("week-flow").textContent =
      "4주차가 끝나면 연습경기 → 월말 결산으로 이어집니다.";
  }

  function effectChips(effects) {
    return Object.entries(effects).map(([key, delta]) => {
      const condition = CONDITIONS.find((c) => c.id === key);
      const good = condition && !condition.higherIsBetter ? delta < 0 : delta > 0;
      return `<span class="chip${good ? "" : " cost"}">${NAMES[key]} ${delta > 0 ? "+" : ""}${delta}</span>`;
    }).join("");
  }

  function renderActivities() {
    const box = document.getElementById("activities");
    if (box.childElementCount === 0) {
      ACTIVITIES.forEach((activity) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card";
        btn.dataset.id = activity.id;
        btn.innerHTML = `
          <span class="name">${activity.name}</span>
          <span class="effects">${effectChips(activity.effects)}</span>
          <span class="desc">${activity.desc}</span>`;
        btn.addEventListener("click", () => assign(activity.id));
        box.append(btn);
      });
    }
    [...box.children].forEach((btn) => {
      btn.disabled = confirmed;
      btn.setAttribute("aria-label", `${activeWeek + 1}주차에 ${btn.querySelector(".name").textContent} 배치`);
    });
  }

  function renderForecast(projection) {
    const alerts = buildAlerts(START, plan, projection);
    document.getElementById("alerts").innerHTML = alerts
      .map((a) => `<li class="${a.risk ? "risk" : ""}"><strong>${a.risk ? "주의" : "안내"}</strong>${a.text}</li>`)
      .join("");
    const missing = plan.filter((p) => !p).length;
    const confirm = document.getElementById("confirm");
    confirm.disabled = confirmed || missing > 0;
    document.getElementById("clear-all").disabled = confirmed;
    document.getElementById("confirm-reason").textContent = confirmed
      ? ""
      : missing > 0 ? `네 주를 모두 채워야 확정할 수 있습니다 (${missing}주 남음).` : "";
  }

  function render() {
    const projection = projectMonth(START, plan);
    renderStats(projection.end);
    renderWeeks(projection);
    renderActivities();
    renderForecast(projection);
  }

  function assign(activityId) {
    if (confirmed) return;
    plan[activeWeek] = activityId;
    const nextEmpty = plan.findIndex((p, i) => !p && i > activeWeek);
    const anyEmpty = plan.findIndex((p) => !p);
    activeWeek = nextEmpty !== -1 ? nextEmpty : anyEmpty !== -1 ? anyEmpty : activeWeek;
    render();
  }

  document.getElementById("clear-all").addEventListener("click", () => {
    plan = Array(RULES.weeks).fill(null);
    activeWeek = 0;
    render();
  });

  document.getElementById("confirm").addEventListener("click", () => {
    if (confirmed || plan.some((p) => !p)) return; // 중복 확정 방지
    confirmed = true;
    render();
    document.getElementById("result").textContent =
      "일정을 확정했습니다. (시안: 주별 진행과 사건은 아직 연결되지 않았습니다.)";
  });

  render();
</script>
<style>
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</body>
</html>
